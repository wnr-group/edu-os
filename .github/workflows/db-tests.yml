name: Database RLS/RPC tests

on:
  pull_request:
    paths:
      - "supabase/**"
      - "packages/**"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "packages/**"

jobs:
  test-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Cleanup existing Supabase containers
        run: |
          supabase stop || true
          docker ps -a | grep supabase | awk '{print $1}' | xargs -r docker rm -f || true
        continue-on-error: true

      - name: Start local Supabase stack
        run: supabase start

      - name: Run SQL regression tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pnpm test:db

      - name: Run Node.js concurrency/insights tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pnpm test:db:mjs

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run package unit tests (turbo run test)
        run: pnpm test

      - name: Type-check packages
        run: pnpm --filter "./packages/**" --if-present type-check
